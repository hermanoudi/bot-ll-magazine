[project]
name = "productbot"
version = "0.1.0"
description = "Bot do Telegram para cadastrar produtos em sites via API de admin, configurado por sites.yaml"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/productbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
